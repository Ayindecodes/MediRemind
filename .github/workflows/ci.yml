# Runs on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only need to read the code
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit in the pull request follows Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(\([a-z0-9/._-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%s' "$BASE..$HEAD" | grep -vE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commit messages don't follow Conventional Commits (see CONTRIBUTING.md):"
            echo "$bad"
            exit 1
          fi
          echo "All $(git rev-list --no-merges --count "$BASE..$HEAD") commits follow the convention."

  checks:
    name: Lint, types, unit tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build (with no environment variables, as it must work without secrets)
        run: npm run build
      - name: Security audit of the app's dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The database, sign-in, the API gateway and the REST API: what the data layer needs, without
      # Studio and the local mailbox. It starts empty, applies every migration in
      # supabase/migrations in order, then loads supabase/seed.sql.
      - name: Start Supabase from the migrations
        run: npx supabase start -x studio,mailpit,postgres-meta
      - name: Database tests (pgTAP)
        run: npm run db:test
      - name: Generated types match the schema
        run: |
          npm run db:types
          if ! git diff --exit-code lib/db/database.types.ts; then
            echo "lib/db/database.types.ts is out of date: run npm run db:types and commit it."
            exit 1
          fi
      - name: Data layer tests (against the local Supabase)
        run: npm run test:db

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the browser, from Playwright's CDN. The runner already has the system libraries
      # (it ships Google Chrome); --with-deps would also install fonts and xvfb through apt,
      # which once took 11 minutes on a slow Ubuntu mirror.
      - name: Install the browser
        run: npx playwright install --only-shell chromium
      - name: Browser tests (builds and starts the app itself)
        run: npm run test:e2e
      - name: Keep the report and traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
